- name: "Gujarat Police Innovation Challenge"
  date: "Oct 2026"
  award: "3rd Place, Rs 1,00,000"
  description: "Neonet: agentic vision intelligence built for SCRB, Gujarat. Onboards existing cameras and reads plates, vehicles, people and crowds live, joins sightings into tracks across gates, and lets agents raise alerts, search past footage and draft reports under role-based access and a full audit trail."
