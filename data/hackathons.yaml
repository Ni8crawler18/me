- name: "Cyber Security Innovation Challenge 1.0"
  award: "Winner — Rs 10,00,000"
  description: "Xylem — privacy-preserving KYC built on zk-SNARKs. Computes eligibility predicates on-device using Aadhaar-based verifiable credentials, emitting concise Boolean attestations with zero PII exposure. DPDP Act aligned. Won as Team Eigen."
  pressLink: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2258036&reg=3&lang=2"
  pressText: "PIB Press Release"
  image: "images/hackathons/CSIC_26.jpeg"
  imageAlt: "Cyber Security Innovation Challenge 1.0 — Team Eigen"

- name: "Hedera Hello Future: Apex Hackathon"
  award: "3rd Place — $8,000 (DeFi Track)"
  description: "Lamina — autonomous AI agent managing the full lifecycle of tokenized real-world assets on Hedera. A natural language command tokenizes a bond; the agent handles KYC/OFAC compliance, coupon distribution, NAV updates, regulatory reporting, and maturity settlement autonomously."
  pressLink: "https://hedera.com/blog/these-are-the-winners-of-the-hello-future-apex-hackathon/"
  pressText: "Hedera Announcement"
  image: "images/hackathons/hedera_apex.png"
  imageAlt: "Hedera Hello Future Apex Hackathon — Lamina"

- name: "C-DAC HimaShield Grand Challenge 2025"
