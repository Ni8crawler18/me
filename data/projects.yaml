  image: "images/portfolio/glofsense-gh.png"
  galleryImage: "images/portfolio/gallery/g-glofsense-gh.png"
  github: "https://github.com/Ni8crawler18/Glofsense"
  live: ""
  modalTitle: "Glofsense — GLOF Early Warning"
  modalDesc: "End-to-end pipeline for glacial lake outburst flood prediction. Sentinel-1 SAR imagery is processed to track surface deformation; temporal sequences are modeled through an LSTM to capture ice-melt dynamics. XGBoost classifies risk levels on fused feature vectors. An ESP32 sensor array (water level, temperature, flow rate) provides real-time ground truth calibration. Downstream module simulates water flow to compute evacuation corridors and time-to-impact estimates. Won C-DAC HimaShield Grand Challenge 2025 (Rs 5,00,000). Covered in Press Information Bureau release."
  tags:
    - "LSTM / XGBoost"
    - "SAR Imagery"
    - "ESP32 Sensor Fusion"

- id: "02"
  title: "Eigencurve."
  category: "Quantum ML / Cybersecurity"
  image: "images/portfolio/eigencurve-gh.png"
  galleryImage: "images/portfolio/gallery/g-eigencurve-gh.png"
  github: "https://github.com/Ni8crawler18/Eigencurve"
  live: ""
  modalTitle: "Eigencurve — Quantum-Classical IDS"
  modalDesc: "Hybrid quantum-classical intrusion detection system. A 4-qubit variational quantum circuit (PennyLane, angle embedding, strongly entangling layers) is trained on CICIDS NetFlow features and benchmarked against XGBoost and LightGBM. The objective was to evaluate whether parameterized quantum circuits offer any advantage on non-linear decision boundaries in high-dimensional traffic data. VirusTotal API handles IOC enrichment and threat correlation. Stack: Next.js frontend, FastAPI backend. 3rd Prize, Indian Army Terrier Cyber Quest 2025."
  tags:
    - "VQC / PennyLane"
    - "XGBoost / LightGBM"
    - "VirusTotal IOC"

- id: "03"
  title: "Nirnay."
  category: "Real-time Fact-Checking"
  image: "images/portfolio/nirnay-gh.png"
  galleryImage: "images/portfolio/gallery/g-nirnay-gh.png"
  github: "https://github.com/Ni8crawler18/Nirnay"
  live: "https://nirnay-labs.vercel.app/"
  modalTitle: "Nirnay — Real-Time Broadcast Fact-Checking"
  modalDesc: "Streaming pipeline for misinformation detection in live broadcasts. FFMPEG ingests TV/radio feeds, Whisper handles ASR with timestamp alignment, DistilBERT extracts verifiable claims from transcript segments, and Google Fact Check API cross-references them against indexed databases. Claims are scored with confidence metrics and surfaced on a Streamlit dashboard with source attribution. Designed for newsroom and regulatory deployment. Winner, NFSU Forensic Hackathon 2025 (Rs 1,00,000)."
  tags:
    - "Whisper ASR"
    - "DistilBERT NLI"
    - "Streaming Inference"

- id: "04"
  title: "Xylem."
  category: "ZK Identity Verification"
  image: "images/portfolio/xylem-gh.png"
  galleryImage: "images/portfolio/gallery/g-xylem-gh.png"
  github: "https://github.com/Ni8crawler18/Xylem"
  live: "https://eigenparse.com"
  modalTitle: "Xylem — Zero-Knowledge KYC"
  modalDesc: "Privacy-preserving identity verification over Aadhaar credentials using ZK-SNARKs. Circom arithmetic circuits with Groth16 proving system let users attest to predicates (age ≥ 18, valid document, state residency) without revealing the underlying data. Proof generation in-browser via WASM in ~500ms, server-side verification in ~10–50ms, proof size < 1KB. The goal is to replace KYC flows that needlessly consume private data with a single boolean attestation. Designed around DPDP Act 2023 requirements."
  tags:
    - "ZK-SNARKs / Groth16"
    - "Circom"
    - "WASM Prover"

- id: "05"
  title: "Phloem."
  category: "Privacy / Consent Layer"
  image: "images/portfolio/phloem-gh.png"
  galleryImage: "images/portfolio/gallery/g-phloem-gh.png"
  github: "https://github.com/Ni8crawler18/Phloem"
  live: "https://eigensparse.com"
  modalTitle: "Phloem — ZK Consent Infrastructure"
  modalDesc: "Consent management layer built on the same principle as Xylem: if a workflow only needs a yes/no answer, it should not require raw personal data. Implements field-level access control, versioned consent records with cryptographic audit trails, and automated DPDP Act compliance reporting. API-first architecture — consent policies are defined as code with pluggable storage backends."
  tags:
    - "ZK Proofs"
    - "Policy-as-Code"
    - "DPDP Compliance"

