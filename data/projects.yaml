  galleryImage: "images/portfolio/gallery/g-xgboost-gh.png"
  github: "https://github.com/Ni8crawler18/XG_boost_classifier"
  live: ""
  modalTitle: "XGBoostClassifier — GST Fraud Detection"
  modalDesc: "Binary classifier for the GST Hackathon — trained on ~700K taxpayer records with 21 attributes to detect fraudulent filings. Pipeline: missing-value imputation, feature scaling, RandomizedSearchCV over 100 iterations for hyperparameter tuning. Evaluated on accuracy, precision, recall, F1, AUC-ROC, log loss, calibration curves, and cumulative gain/lift charts. SHAP feature importance analysis identifies which attributes are most predictive of fraud."
  tags:
    - "XGBoost"
    - "SHAP"
    - "RandomizedSearchCV"

