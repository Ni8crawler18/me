    <meta charset="utf-8">
    <title>{{ if .IsHome }}Venkatesh{{ else }}{{ .Title }} — Venkatesh{{ end }}</title>
    <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Venkatesh">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ if .IsHome }}Venkatesh — {{ .Site.Params.description }}{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ "images/about-photo.jpg" | absURL }}">
    {{- if .IsPage }}
    <meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
    {{- range .Params.tags }}
    <meta property="article:tag" content="{{ . }}">
    {{- end }}
    {{- end }}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ if .IsHome }}Venkatesh{{ else }}{{ .Title }}{{ end }}">
    <meta name="twitter:description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ "images/about-photo.jpg" | absURL }}">

    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ "css/vendor.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "icons/icon-180.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "icons/icon-32.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "icons/icon-16.png" | relURL }}">
    <link rel="manifest" href="{{ "site.webmanifest" | relURL }}">

    {{- if .Site.Params.umami.websiteId }}
    <script defer src="{{ .Site.Params.umami.src }}" data-website-id="{{ .Site.Params.umami.websiteId }}"></script>
    {{- end }}
