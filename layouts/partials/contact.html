            <!-- ### contact
            ================================================== -->
            <section id="contact" class="s-contact target-section">

                <div class="row contact-top">
                    <div class="column lg-12">
                        <h2 class="text-pretitle">
                            Get In Touch
                        </h2>

                        <p class="h1">
                            If you want to talk about AI, ML,
                            or cryptography — reach out.
                        </p>
                    </div>
                </div>

                <div class="row contact-bottom">
                    <div class="column lg-3 md-5 tab-6 stack-on-550 contact-block">
                        <h3 class="text-pretitle">Reach me at</h3>
                        <p class="contact-links">
                            <a href="mailto:{{ .Site.Params.email }}" class="mailtoui">{{ .Site.Params.email }}</a> <br>
                            <a href="tel:{{ .Site.Params.phone }}">{{ .Site.Params.phone }}</a>
                        </p>
                    </div>
                    <div class="column lg-4 md-5 tab-6 stack-on-550 contact-block">
                        <h3 class="text-pretitle">Social</h3>
                        <ul class="contact-social">
                            <li><a href="{{ .Site.Params.github }}">Github</a></li>
                            <li><a href="{{ .Site.Params.linkedin }}">Linkedin</a></li>
                            <li><a href="mailto:{{ .Site.Params.email }}">Email</a></li>
                        </ul>
                    </div>
                    <div class="column lg-4 md-12 contact-block">
                        <a href="mailto:{{ .Site.Params.email }}" class="mailtoui btn btn--medium u-fullwidth contact-btn">Say Hello.</a>
                    </div>
                </div>

            </section>
