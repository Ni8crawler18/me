<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="proving-systems-title proving-systems-desc">
  <title id="proving-systems-title">Choosing a ZK Proving System</title>
  <desc id="proving-systems-desc">A 1-to-3 decision tree from "what constraint matters most" branching into Groth16, PLONK, and STARKs with their key tradeoffs.</desc>

  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
  </defs>

  <style>
    .sketch-diagram svg text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
    text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
  </style>

  <text x="360" y="42" font-size="28" fill="#ffffff" text-anchor="middle">Choosing a ZK Proving System</text>
  <text x="360" y="68" font-size="17" fill="rgba(255,255,255,0.55)" text-anchor="middle">three production-ready families — pick the constraint that hurts most</text>

  <!-- Root node -->
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="220" y="92" width="280" height="50" rx="6" stroke="#ffffff" stroke-width="2.2" fill="rgba(255,255,255,0.06)"/>
    <!-- 3 fan-out branches -->
    <path stroke="rgba(255,255,255,0.55)" stroke-width="2" d="M 290 142 Q 220 175 130 200"/>
    <path stroke="rgba(255,255,255,0.55)" stroke-width="2" d="M 360 142 L 360 198"/>
    <path stroke="rgba(255,255,255,0.55)" stroke-width="2" d="M 430 142 Q 500 175 590 200"/>
  </g>
  <text x="360" y="123" font-size="19" fill="#ffffff" text-anchor="middle">what constraint matters most?</text>

  <!-- Three branch boxes -->
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="40" y="200" width="180" height="100" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <rect x="270" y="200" width="180" height="100" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <rect x="500" y="200" width="180" height="100" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
  </g>

  <!-- Box titles + key stat -->
  <g text-anchor="middle">
    <text x="130" y="234" font-size="22" fill="#ffffff">GROTH16</text>
    <text x="130" y="262" font-size="16" fill="#EABE7B">~128 B proof</text>
    <text x="130" y="285" font-size="14" fill="rgba(255,255,255,0.6)">~10 ms verify</text>

    <text x="360" y="234" font-size="22" fill="#ffffff">PLONK</text>
    <text x="360" y="262" font-size="16" fill="#EABE7B">~500 B proof</text>
    <text x="360" y="285" font-size="14" fill="rgba(255,255,255,0.6)">~20 ms verify</text>

    <text x="590" y="234" font-size="22" fill="#ffffff">STARKs</text>
    <text x="590" y="262" font-size="16" fill="#EABE7B">~50–200 KB</text>
    <text x="590" y="285" font-size="14" fill="rgba(255,255,255,0.6)">~100 ms verify</text>
  </g>

  <!-- Tradeoff bullets below each box -->
  <g text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.65)">
    <text x="130" y="328">per-circuit setup</text>
    <text x="130" y="348">smallest proof</text>
    <text x="130" y="368">on-chain favorite</text>

    <text x="360" y="328">universal setup</text>
    <text x="360" y="348">slight overhead</text>
    <text x="360" y="368">updates often</text>

    <text x="590" y="328">no setup needed</text>
    <text x="590" y="348">post-quantum safe</text>
    <text x="590" y="368">parallelizable prover</text>
  </g>

  <!-- "Best for" tags -->
  <g text-anchor="middle">
    <text x="130" y="408" font-size="13" fill="rgba(255,107,71,0.85)" font-style="italic">→ on-chain, mobile</text>
    <text x="360" y="408" font-size="13" fill="rgba(255,107,71,0.85)" font-style="italic">→ multi-app platforms</text>
    <text x="590" y="408" font-size="13" fill="rgba(255,107,71,0.85)" font-style="italic">→ off-chain, future-proof</text>
  </g>

  <!-- Bottom callout -->
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="120" y="445" width="480" height="58" rx="6" stroke="rgba(234,190,123,0.5)" stroke-width="1.8" fill="rgba(234,190,123,0.05)" stroke-dasharray="6 4"/>
  </g>
  <text x="360" y="471" font-size="17" fill="#ffffff" text-anchor="middle">Xylem chose Groth16 —</text>
  <text x="360" y="492" font-size="15" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-style="italic">tiny proof, in-browser WASM proving in ~500 ms, fixed circuit</text>
</svg>
