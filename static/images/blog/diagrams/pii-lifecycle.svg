<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pii-lifecycle-title pii-lifecycle-desc">
  <title id="pii-lifecycle-title">The Lifecycle of Collected PII</title>
  <desc id="pii-lifecycle-desc">A flowchart showing the six stages PII passes through after collection: Collection, Replication, Re-purposing, Access, Aggregation, and Eventual Leakage. Each stage adds exposure surface; the lifecycle terminates in inevitable leakage.</desc>

  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
    <filter id="sketch-strong" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
  </defs>

  <style>
    .sketch-diagram svg text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
    text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
  </style>

  <!-- Title -->
  <text x="360" y="42" font-size="30" fill="#ffffff" text-anchor="middle">The Lifecycle of Collected PII</text>
  <text x="360" y="70" font-size="17" fill="rgba(255,255,255,0.55)" text-anchor="middle">every collected record ends in exposure — only when and how much vary</text>

  <!-- Sketchy shapes -->
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Box 1: Collection -->
    <rect x="180" y="100" width="240" height="72" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 176 L 300 200"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 192 L 300 202 L 307 192"/>

    <!-- Box 2: Replication -->
    <rect x="180" y="206" width="240" height="72" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 282 L 300 306"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 298 L 300 308 L 307 298"/>

    <!-- Box 3: Re-purposing -->
    <rect x="180" y="312" width="240" height="72" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 388 L 300 412"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 404 L 300 414 L 307 404"/>

    <!-- Box 4: Access -->
    <rect x="180" y="418" width="240" height="72" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 494 L 300 518"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 510 L 300 520 L 307 510"/>

    <!-- Box 5: Aggregation -->
    <rect x="180" y="524" width="240" height="72" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <!-- Final arrow into terminal box: orange-red for emphasis -->
    <path stroke="rgba(255,107,71,0.85)" stroke-width="2.6" d="M 300 600 L 300 632"/>
    <path stroke="rgba(255,107,71,0.85)" stroke-width="2.6" d="M 292 622 L 300 634 L 308 622"/>
  </g>

  <!-- Terminal alert box -->
  <g filter="url(#sketch-strong)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="180" y="638" width="240" height="76" rx="6" stroke="#FF6B47" stroke-width="3.5" fill="rgba(255,107,71,0.13)"/>
  </g>

  <!-- Box labels (unfiltered) -->
  <g text-anchor="middle" fill="#ffffff">
    <text x="300" y="144" font-size="24">COLLECTION</text>
    <text x="300" y="250" font-size="24">REPLICATION</text>
    <text x="300" y="356" font-size="24">RE-PURPOSING</text>
    <text x="300" y="462" font-size="24">ACCESS</text>
    <text x="300" y="568" font-size="24">AGGREGATION</text>
    <text x="300" y="685" font-size="25" fill="#FF8C70">EVENTUAL LEAKAGE</text>
  </g>

  <!-- Side annotations (right of boxes) -->
  <g font-size="16" fill="rgba(255,255,255,0.6)">
    <text x="438" y="120">Aadhaar XML, PAN,</text>
    <text x="438" y="140">bank stmt, selfie,</text>
    <text x="438" y="160">device fingerprint</text>

    <text x="438" y="226">backups, warehouses,</text>
    <text x="438" y="246">vendor APIs,</text>
    <text x="438" y="266">regulator submissions</text>

    <text x="438" y="332">marketing segments,</text>
    <text x="438" y="352">lookalike audiences,</text>
    <text x="438" y="372">cross-product models</text>

    <text x="438" y="438">employees, contractors,</text>
    <text x="438" y="458">support, ML pipelines,</text>
    <text x="438" y="478">BI dashboards</text>

    <text x="438" y="544">name + DOB + city =</text>
    <text x="438" y="564">near-unique join key</text>
    <text x="438" y="584">across leaked datasets</text>
  </g>

  <g font-size="16" fill="rgba(255,140,112,0.78)">
    <text x="438" y="660">S3 misconfigs, insider</text>
    <text x="438" y="680">exfiltration, vendor</text>
    <text x="438" y="700">breach, subpoena</text>
  </g>

  <!-- Time axis (left of boxes) -->
  <g font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="end" font-style="italic">
    <text x="160" y="140">t = 0</text>
    <text x="160" y="352">t + days</text>
    <text x="160" y="564">t + months</text>
    <text x="160" y="680">t + years</text>
  </g>
</svg>
