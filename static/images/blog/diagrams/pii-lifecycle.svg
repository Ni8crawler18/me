<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 940" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pii-lifecycle-title pii-lifecycle-desc">
  <title id="pii-lifecycle-title">The Lifecycle of Collected PII</title>
  <desc id="pii-lifecycle-desc">A flowchart showing the six stages PII passes through after collection: Collection, Replication, Re-purposing, Access, Aggregation, and Eventual Leakage. Each stage adds exposure surface; the lifecycle terminates in inevitable leakage.</desc>

  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
    <filter id="sketch-strong" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
  </defs>

  <style>
    .sketch-diagram svg text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
    text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
  </style>

  <!-- ───── Title ───── -->
  <text x="360" y="46" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">The Lifecycle of Collected PII</text>
  <text x="360" y="74" font-size="19" font-weight="500" fill="rgba(255,255,255,0.55)" text-anchor="middle">every collected record ends in exposure — only when and how much vary</text>

  <!-- ───── Sketchy shapes (filtered for wobble) ───── -->
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">

    <!-- Box 1: Collection -->
    <rect x="180" y="106" width="240" height="78" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <!-- Arrow 1 -->
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 188 L 300 214"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 206 L 300 216 L 307 206"/>

    <!-- Box 2: Replication -->
    <rect x="180" y="218" width="240" height="78" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 300 L 300 326"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 318 L 300 328 L 307 318"/>

    <!-- Box 3: Re-purposing -->
    <rect x="180" y="330" width="240" height="78" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 412 L 300 438"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 430 L 300 440 L 307 430"/>

    <!-- Box 4: Access -->
    <rect x="180" y="442" width="240" height="78" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 300 524 L 300 550"/>
    <path stroke="rgba(255,255,255,0.65)" stroke-width="2.2" d="M 293 542 L 300 552 L 307 542"/>

    <!-- Box 5: Aggregation -->
    <rect x="180" y="554" width="240" height="78" rx="6" stroke="#EABE7B" stroke-width="2.5" fill="rgba(234,190,123,0.08)"/>
    <!-- Heavier arrow into the terminal box -->
    <path stroke="rgba(255,107,71,0.85)" stroke-width="2.6" d="M 300 636 L 300 678"/>
    <path stroke="rgba(255,107,71,0.85)" stroke-width="2.6" d="M 292 668 L 300 680 L 308 668"/>
  </g>

  <!-- Terminal alert box: stronger sketchiness -->
  <g filter="url(#sketch-strong)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="155" y="685" width="290" height="98" rx="8" stroke="#FF6B47" stroke-width="3.5" fill="rgba(255,107,71,0.13)"/>
    <!-- Inner double-stroke for emphasis -->
    <rect x="161" y="691" width="278" height="86" rx="6" stroke="#FF6B47" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- ───── Box labels (NOT filtered, stay crisp) ───── -->
  <g text-anchor="middle" fill="#ffffff" font-weight="700">
    <text x="300" y="142" font-size="24">COLLECTION</text>
    <text x="300" y="254" font-size="24">REPLICATION</text>
    <text x="300" y="366" font-size="24">RE-PURPOSING</text>
    <text x="300" y="478" font-size="24">ACCESS</text>
    <text x="300" y="590" font-size="24">AGGREGATION</text>
    <text x="300" y="725" font-size="30" fill="#FF8C70">EVENTUAL LEAKAGE</text>
    <text x="300" y="755" font-size="17" font-weight="500" fill="rgba(255,140,112,0.75)">when, not if</text>
  </g>

  <!-- ───── Side annotations ───── -->
  <g font-size="17" font-weight="500" fill="rgba(255,255,255,0.6)">
    <text x="438" y="138">Aadhaar XML, PAN,</text>
    <text x="438" y="160">bank stmt, selfie,</text>
    <text x="438" y="182">device fingerprint</text>

    <text x="438" y="250">backups, warehouses,</text>
    <text x="438" y="272">vendor APIs,</text>
    <text x="438" y="294">regulator submissions</text>

    <text x="438" y="362">marketing segments,</text>
    <text x="438" y="384">lookalike audiences,</text>
    <text x="438" y="406">cross-product models</text>

    <text x="438" y="474">employees, contractors,</text>
    <text x="438" y="496">support, ML pipelines,</text>
    <text x="438" y="518">BI dashboards</text>

    <text x="438" y="586">name + DOB + city =</text>
    <text x="438" y="608">near-unique join key</text>
    <text x="438" y="630">across leaked datasets</text>
  </g>

  <g font-size="17" font-weight="500" fill="rgba(255,140,112,0.78)">
    <text x="438" y="713">S3 misconfigs, insider</text>
    <text x="438" y="735">exfiltration, vendor</text>
    <text x="438" y="757">breach, subpoena</text>
  </g>

  <!-- ───── Time axis on the left ───── -->
  <g font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="end" font-style="italic">
    <text x="155" y="148">t = 0</text>
    <text x="155" y="372">t + days</text>
    <text x="155" y="596">t + months</text>
    <text x="155" y="730">t + years</text>
  </g>
</svg>
