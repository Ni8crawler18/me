<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="detect-vs-agentic-title detect-vs-agentic-desc">
  <title id="detect-vs-agentic-title">Detection Only vs Agentic</title>
  <desc id="detect-vs-agentic-desc">Left: detection raises alerts into a queue nobody can keep up with. Right: agents triage inside a loop with a human, and corrections improve the system.</desc>

  <defs>
    <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
    <filter id="sketch-strong" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="43" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
  </defs>

  <style>
    .sketch-diagram svg text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
    text { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
  </style>

  <text x="360" y="42" font-size="28" fill="#ffffff" text-anchor="middle">Detection Only vs Agentic</text>
  <text x="360" y="68" font-size="17" fill="rgba(255,255,255,0.55)" text-anchor="middle">same cameras, two architectures</text>
  <g filter="url(#sketch)" fill="none" stroke-linejoin="round" stroke-linecap="round">
